<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Assessment Radixa</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Noto Sans',system-ui,sans-serif}
a{color:#8a5a00}a:hover{color:#5c3c00}
button{font-family:inherit}
button:focus-visible,a:focus-visible{outline:2px solid #f2b705;outline-offset:2px}
.card{border:1px solid #e6e3da;border-radius:12px;background:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;height:38px;padding:0 16px;border-radius:10px;border:0;background:#1b1b1a;color:#fff;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer}
.btn2{display:inline-flex;align-items:center;justify-content:center;height:38px;padding:0 16px;border-radius:10px;border:0;background:#efede6;color:#1b1b1a;font-size:14px;font-weight:600;cursor:pointer}
@media (max-width:900px){
  .sbnav{flex-direction:row !important;overflow-x:auto}
  .sb{flex:1 1 100% !important;max-width:none !important;border-right:0 !important;border-bottom:1px solid #e8e6e0}
}

/* --- TAMBAHAN CSS LOGO MULAI DARI SINI --- */
@keyframes logoLoadEffect {
  0% { transform: scale(0.5) rotate(-15deg); opacity: 0; }
  60% { transform: scale(1.1) rotate(5deg); opacity: 1; }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}
.logo-x-anim {
  height: 28px;
  width: auto;
  margin: 0 1px;
  animation: logoLoadEffect 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}
.logo-text {
  font-family: 'Noto Sans', system-ui, sans-serif;
  font-size: 24px;
  font-weight: 800;
  letter-spacing: 0.5px;
  color: #1b1b1a;
  display: inline-flex;
  align-items: center;
}
/* --- TAMBAHAN CSS LOGO SELESAI --- */
</style>
</helmet>

<div style="display:flex;flex-direction:column;min-height:100vh;background:#fff;color:#1b1b1a;font-family:'Noto Sans',system-ui,sans-serif">
  <header style="display:flex;align-items:center;justify-content:space-between;gap:12px;height:64px;flex:0 0 auto;box-sizing:border-box;padding:0 24px;border-bottom:1px solid #e8e6e0">
    
    <!-- --- TAMBAHAN HTML LOGO MULAI DARI SINI --- -->
    <div class="logo-text" style="padding-left:12px; cursor:pointer;">
      RADI<img src="assets/img/logo.png" alt="X" class="logo-x-anim">A
    </div>
    <!-- --- TAMBAHAN HTML LOGO SELESAI --- -->

    <div style="display:flex;align-items:center;gap:20px">
      <div style="display:flex;padding:3px;gap:3px;background:#f1efe8;border-radius:999px">
        <button type="button" onClick="{{onId}}" style="{{idSty}}">ID</button>
        <button type="button" onClick="{{onEn}}" style="{{enSty}}">EN</button>
      </div>
      <a href="index.html" style="color:#1b1b1a;font-size:14px;font-weight:600;text-decoration:none">Keluar</a>
    </div>
  </header>
  <div style="display:flex;flex:1 1 auto;flex-wrap:wrap">
    <aside class="sb" style="{{asideSty}}">
      <nav class="sbnav" style="display:flex;flex-direction:column;gap:4px;padding:16px 12px;flex:1">
        <sc-for list="{{nav}}" as="n" hint-placeholder-count="9">
          <a href="{{n.href}}" style="{{n.sty}}" aria-current="{{n.cur}}" title="{{n.label}}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:0 0 auto"><path d="{{n.d}}"/></svg>
            <span style="{{labelSty}}">{{n.label}}</span>
            <sc-if value="{{n.dot}}" hint-placeholder-val="{{false}}"><span style="margin-left:auto;width:8px;height:8px;border-radius:50%;background:#d93025" aria-label="Ada saran baru"></span></sc-if>
          </a>
        </sc-for>
      </nav>
      <button type="button" onClick="{{onCollapse}}" style="display:flex;align-items:center;gap:12px;margin:8px 12px 16px;padding:10px 14px;border:0;background:none;font-size:14px;font-weight:500;color:#3b3a36;cursor:pointer;border-radius:10px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{collapseIconSty}}"><path d="M11 6l-6 6 6 6M19 6l-6 6 6 6"/></svg>
        <span style="{{labelSty}}">Ciutkan menu</span>
      </button>
    </aside>

    <index style="flex:1 1 560px;min-width:0;box-sizing:border-box;padding:32px;display:flex;flex-direction:column;gap:24px">
      <div style="display:flex;flex-direction:column;gap:4px">
        <h1 style="margin:0;font-size:28px;font-weight:700">Assessment</h1>
        <p style="margin:0;font-size:15px;color:#5f5d57;line-height:1.5">Tes dari perusahaan tempat kamu melamar. Jawaban tersimpan otomatis selama pengerjaan.</p>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;max-width:1040px">
        <sc-for list="{{tests}}" as="t" hint-placeholder-count="3">
          <article class="card" style="padding:20px;display:flex;flex-direction:column;gap:12px">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
              <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
                <h2 style="margin:0;font-size:17px;font-weight:700">{{t.title}}</h2>
                <span style="font-size:13px;color:#4a4944">{{t.company}}</span>
              </div>
              <span style="{{t.pillSty}}">{{t.status}}</span>
            </div>
            <dl style="margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px">
              <dt style="color:#5f5d57">Durasi</dt><dd style="margin:0">{{t.duration}}</dd>
              <dt style="color:#5f5d57">Isi</dt><dd style="margin:0">{{t.content}}</dd>
              <dt style="color:#5f5d57">{{t.dateLabel}}</dt><dd style="margin:0">{{t.date}}</dd>
            </dl>
            <sc-if value="{{t.hasScore}}" hint-placeholder-val="{{false}}">
              <div style="display:flex;align-items:baseline;gap:6px"><span style="font-size:30px;font-weight:700">{{t.score}}</span><span style="font-size:13px;color:#5f5d57">dari 100</span></div>
            </sc-if>
            <sc-if value="{{t.hasNote}}" hint-placeholder-val="{{false}}"><p style="margin:0;font-size:13px;line-height:1.5;color:#3b3a36">{{t.note}}</p></sc-if>
            <sc-if value="{{t.hasAction}}" hint-placeholder-val="{{true}}"><button type="button" class="btn" style="align-self:flex-start" onClick="{{t.onAct}}">{{t.action}}</button></sc-if>
          </article>
        </sc-for>
      </div>
    </index>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
const NAV = [
  { id: 'dash', label: 'Dashboard', href: 'Dashboard.html', d: 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z' },
  { id: 'profile', label: 'My Profile', href: 'MyProfile.html', d: 'M12 12a4 4 0 100-8 4 4 0 000 8zM4 20c0-3.5 3.6-6 8-6s8 2.5 8 6' },
  { id: 'cv', label: 'My CV', href: 'CVSaya.html', d: 'M4 20l1-4L16 5l3 3L8 19zM14 7l3 3' },
  { id: 'cvs', label: 'CV saya', href: 'CVSaya.html', d: 'M8 4h9v13H8zM5 7v13h9', sub: true },
  { id: 'isi', label: 'Isi CV', href: 'IsiCV.html', d: 'M5 7h14M5 12h14M5 17h9', sub: true },
  { id: 'saran', label: 'Saran', href: 'Saran.html', d: 'M9 18h6M10 21h4M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z', sub: true, dot: true },
  { id: 'apps', label: 'My Applications', href: 'Lamaran.html', d: 'M4 8h16v11H4zM9 8V5h6v3M4 13h16' },
  { id: 'assess', label: 'Assessment', href: 'Assessment.html', d: 'M8 4h8v3H8zM6 6h12v14H6zM9 12h6M9 16h4' },
  { id: 'sched', label: 'Schedule', href: 'Jadwal.html', d: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4' },
  { id: 'career', label: 'Career Page', href: 'CareerPage.html', d: 'M12 21a9 9 0 100-18 9 9 0 000 18zM3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18' }
];
const ACTIVE = 'assess';
const TESTS = [
  { id: 'a1', title: 'Tes Logika dan Data', company: 'Tokoloka · Business Intelligence Analyst', duration: '45 menit', content: '30 soal pilihan ganda: logika, membaca tabel, dasar statistik', dateLabel: 'Batas', date: 'Jumat, 20 Nov 2026, 23.59 WIB' },
  { id: 'a2', title: 'Studi Kasus SQL', company: 'PT Kreasi Data · Data Analyst', duration: '60 menit', content: '4 soal query: join, agregasi, window function', dateLabel: 'Selesai', date: 'Jumat, 6 Nov 2026', done: true, score: 82 },
  { id: 'a3', title: 'Bahasa Inggris Bisnis', company: 'Nusa Pangan · Junior Data Analyst', duration: '20 menit', content: '20 soal membaca dan tata bahasa', dateLabel: 'Batas', date: 'Jumat, 27 Nov 2026, 23.59 WIB' }
];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { lang: 'id', collapsed: false, started: {} };
  }
  renderVals() {
    const s = this.state;
    const sbW = s.collapsed ? 76 : 240;
    const nav = NAV.map((n) => {
      const sub = n.id === ACTIVE && n.sub;
      const top = n.id === ACTIVE && !n.sub;
      const grp = n.id === 'cv' && ['cvs', 'isi', 'saran'].indexOf(ACTIVE) >= 0;
      return {
        label: n.label, href: n.href, d: n.d, dot: !!n.dot, cur: n.id === ACTIVE ? 'page' : 'false',
        sty: 'display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;text-decoration:none;color:#1b1b1a;font-size:14px;font-weight:' + (top || sub || grp ? 600 : 500) +
          ';background:' + (sub ? '#efede6' : top || grp ? '#fdf1cf' : 'transparent') + ';margin-left:' + (n.sub && !s.collapsed ? 14 : 0) + 'px'
      };
    });
    const pill = (on) => 'height:34px;padding:0 18px;border:0;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;' + (on ? 'background:#1b1b1a;color:#fff' : 'background:transparent;color:#4a4944');
    const pc = 'align-self:flex-start;flex:0 0 auto;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;';
    const tests = TESTS.map((t) => {
      const going = !!s.started[t.id];
      const status = t.done ? 'Selesai' : going ? 'Sedang dikerjakan' : 'Belum dimulai';
      const col = t.done ? 'background:#e4f1e9;color:#25603d' : going ? 'background:#e3ecfb;color:#1d4a9c' : 'background:#fdf1cf;color:#7a4f00';
      return {
        title: t.title, company: t.company, duration: t.duration, content: t.content, dateLabel: t.dateLabel, date: t.date,
        status, pillSty: pc + col, hasScore: !!t.done, score: t.score || 0,
        hasNote: going, note: 'Jawaban tersimpan otomatis. Kamu bisa menutup halaman dan melanjutkan sebelum batas waktu.',
        hasAction: !t.done, action: going ? 'Lanjutkan tes' : 'Mulai tes',
        onAct: () => this.setState({ started: Object.assign({}, s.started, { [t.id]: true }) })
      };
    });
    return {
      nav, asideSty: 'flex:0 0 ' + sbW + 'px;max-width:' + sbW + 'px;box-sizing:border-box;border-right:1px solid #e8e6e0;display:flex;flex-direction:column;overflow-y:auto',
      labelSty: s.collapsed ? 'display:none' : 'white-space:nowrap', collapseIconSty: 'flex:0 0 auto;' + (s.collapsed ? 'transform:rotate(180deg)' : ''),
      onCollapse: () => this.setState({ collapsed: !s.collapsed }),
      idSty: pill(s.lang === 'id'), enSty: pill(s.lang === 'en'),
      onId: () => this.setState({ lang: 'id' }), onEn: () => this.setState({ lang: 'en' }),
      tests
    };
  }
}
</script>
</body>
</html>
